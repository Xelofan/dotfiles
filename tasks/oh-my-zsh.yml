---
# replacement for the gantsign.oh-my-zsh Ansible role as it's no longer maintained

- name: Install Oh My Zsh dependencies
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  ansible.builtin.package:
    name: "{{ oh_my_zsh_dependencies }}"
    state: present

- name: Clone Oh My Zsh
  # core.autocrlf=input prevents https://github.com/ohmyzsh/ohmyzsh/issues/4402
  ansible.builtin.command: >-
    git clone -c core.autocrlf=input --depth=1
    {{ oh_my_zsh_repo }} .oh-my-zsh
  args:
    chdir: "~{{ ansible_facts['user_id'] }}"
    creates: "~{{ ansible_facts['user_id'] }}/.oh-my-zsh"

- name: Check zsh-autosuggestions / zsh-syntax-highlighting migration
  ansible.builtin.stat:
    path: "{{ item }}/.git"
  loop:
    - "~{{ ansible_facts['user_id'] }}/.oh-my-zsh/plugins/zsh-autosuggestions"
    - "~{{ ansible_facts['user_id'] }}/.oh-my-zsh/plugins/zsh-syntax-highlighting"
  register: omz_legacy_plugins

- name: Migrate zsh-autosuggestions / zsh-syntax-highlighting
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ omz_legacy_plugins.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
  when: item.stat.exists

- name: Update Oh My Zsh
  # fixes autosuggestions and syntax-highlighting after migration
  ansible.builtin.command: git pull --rebase --quiet origin master
  args:
    chdir: "~{{ ansible_facts['user_id'] }}/.oh-my-zsh"
  changed_when: false
  failed_when: false

- name: Set permissions of Oh My Zsh
  ansible.builtin.file:
    path: "~{{ ansible_facts['user_id'] }}/.oh-my-zsh"
    mode: "go-w"
    recurse: true

- name: Set default shell for {{ ansible_facts['user_id'] }}
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ oh_my_zsh_zsh_path }}"

- name: Write managed zsh config for {{ ansible_facts['user_id'] }}
  ansible.builtin.template:
    src: zshrc-managed.j2
    dest: "~{{ ansible_facts['user_id'] }}/.zshrc-managed"
    backup: true
    mode: "u=rw,go=r"

- name: Source managed zsh config
  ansible.builtin.blockinfile:
    path: "~{{ ansible_facts['user_id'] }}/.zshrc"
    create: true
    backup: true
    insertbefore: BOF
    mode: "u=rw,go=r"
    block: |
      [ -f "$HOME/.zshrc-managed" ] && source "$HOME/.zshrc-managed"
