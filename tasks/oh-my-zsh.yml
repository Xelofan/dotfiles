---
# replacement for the gantsign.oh-my-zsh Ansible role as it's no longer maintained

- name: Install Oh My Zsh dependencies
  become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
  ansible.builtin.package:
    name: "{{ oh_my_zsh_dependencies }}"
    state: present

- name: Clone Oh My Zsh
  # core.autocrlf=input prevents https://github.com/ohmyzsh/ohmyzsh/issues/4402
  ansible.builtin.command: >-
    git clone -c core.autocrlf=input --depth=1
    {{ oh_my_zsh_repo }} .oh-my-zsh
  args:
    chdir: "~{{ ansible_user_id }}"
    creates: "~{{ ansible_user_id }}/.oh-my-zsh"

- name: Check zsh-autosuggestions / zsh-syntax-highlighting migration
  ansible.builtin.stat:
    path: "{{ item }}/.git"
  loop:
    - "~{{ ansible_user_id }}/.oh-my-zsh/plugins/zsh-autosuggestions"
    - "~{{ ansible_user_id }}/.oh-my-zsh/plugins/zsh-syntax-highlighting"
  register: omz_legacy_plugins

- name: Migrate zsh-autosuggestions / zsh-syntax-highlighting
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ omz_legacy_plugins.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
  when: item.stat.exists

- name: Set permissions of Oh My Zsh
  ansible.builtin.file:
    path: "~{{ ansible_user_id }}/.oh-my-zsh"
    mode: "go-w"
    recurse: true

- name: Set default shell for {{ ansible_user_id }}
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: "{{ oh_my_zsh_zsh_path }}"

- name: Write .zshrc for {{ ansible_user_id }}
  ansible.builtin.template:
    src: zshrc.j2
    dest: "~{{ ansible_user_id }}/.zshrc"
    backup: true
    mode: "u=rw,go=r"
