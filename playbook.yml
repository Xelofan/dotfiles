- hosts: localhost
  become: false

  vars:
    packages: "zsh,wget"
    optional_packages: "eza"

    # Oh My Zsh
    oh_my_zsh_repo: https://github.com/ohmyzsh/ohmyzsh.git
    oh_my_zsh_zsh_path: /bin/zsh
    oh_my_zsh_dependencies:
      - git
      - zsh
    oh_my_zsh_theme: alanpeabody
    oh_my_zsh_update_mode: auto
    oh_my_zsh_update_frequency: 14
    oh_my_zsh_plugins:
      - git
      - brew
      - ansible
      - timer
      - kubectl
      - docker
      - hcloud
      - zsh-autosuggestions
      - helm
      # must stay last, it highlights everything loaded before it
      - zsh-syntax-highlighting

  tasks:
    - name: Add terra repository
      become: true
      when: ansible_facts['distribution'] == "Fedora" and ansible_facts['distribution_major_version'] | int >= 41
      ansible.builtin.yum_repository:
        name: terra
        description: Terra Repository
        baseurl: "https://repos.fyralabs.com/terra{{ ansible_facts['distribution_major_version'] }}"
        gpgcheck: no
        enabled: yes
        state: present

    - name: Install terra-release
      become: true
      when: ansible_facts['distribution'] == "Fedora" and ansible_facts['distribution_major_version'] | int >= 41
      ansible.builtin.dnf5:
        name: terra-release
        state: present

    - name: Install packages
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      package:
        name: "{{ packages }}"
        state: present

    - name: Install optional packages
      become: "{{ ansible_facts['distribution'] != 'MacOSX' }}"
      package:
        name: "{{ optional_packages }}"
        state: present
      ignore_errors: true

    - name: Configure Oh My Zsh for {{ ansible_facts['user_id'] }}
      ansible.builtin.include_tasks: tasks/oh-my-zsh.yml

    - name: Check for ~/dotfiles
      stat:
        path: ~/dotfiles
      register: oldPath

    - name: Migrate ~/dotfiles -> ~/.dotfiles
      command: mv ~/dotfiles ~/.dotfiles
      when: oldPath.stat.exists

    - name: Clone dotfiles
      git:
        repo: "https://github.com/Xelofan/dotfiles"
        dest: "~/.dotfiles"